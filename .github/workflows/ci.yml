name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install simulation dependencies
        run: pip install -r requirements.txt
      - name: Fetch pinned assets (models, three.js, SO-101 meshes)
        run: python app/prepare.py
      - name: Python tests
        run: python -m unittest discover -s app -p "test_*.py"
      - name: Node tests
        run: node --test app/*.test.mjs app/test_sim_hand.mjs
